<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Notes</title>
    <meta name="google" content="notranslate" />
    <meta name="yandex" content="none" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23059669'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='26' y='30' width='48' height='9' rx='4.5'/%3E%3Crect x='26' y='48' width='48' height='9' rx='4.5'/%3E%3Crect x='26' y='66' width='30' height='9' rx='4.5'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>

<body>
    <div id="localBanner">Everything is stored locally in your browser — nothing leaves your device.</div>

    <input id="descInput" type="text" placeholder="Short description (optional)" autocomplete="off" />
    <textarea id="mainText" placeholder="Start typing…" autofocus></textarea>

    <div id="controls">
        <div class="controls-left">
            <button id="saveBtn" disabled>Save note</button>
            <button id="clearBtn">Clear</button>

            <div id="menu" class="menu">
                <button id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false">More ▾</button>
                <div id="menuList" class="menu-list" hidden>
                    <button id="exportBtn" type="button">Export</button>
                    <button id="importBtn" type="button">Import</button>
                    <button id="deleteAllBtn" type="button" class="menu-danger">Delete all</button>
                </div>
            </div>
            <input type="file" id="fileInput" accept=".json,application/json" hidden />
        </div>

        <div id="viewControls">
            <div id="width-toggle">
                <button data-width="1050px">Narrow</button>
                <button data-width="1350px">Wide</button>
            </div>
            <div id="font-toggle">
                <button data-font="'Inter', sans-serif">Sans</button>
                <button data-font="'JetBrains Mono', monospace">Mono</button>
            </div>
        </div>
    </div>

    <div id="searchRow">
        <input id="searchInput" type="search" placeholder="Search saved notes…" autocomplete="off" />
    </div>

    <ul id="savesList"></ul>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
